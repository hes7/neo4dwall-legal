:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #f4f6fc;
  background: #090d18;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 280px;
  min-height: 100svh;
  background:
    radial-gradient(ellipse at 15% 5%, #10285580 0, transparent 43%),
    radial-gradient(ellipse at 100% 80%, #29204f50 0, transparent 48%),
    #090d18;
}
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.page { width: min(100%, 520px); margin: 0 auto; padding: 28px 24px 24px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 2px 24px; }
.wordmark { color: #d4dcee; font-size: 11px; font-weight: 650; letter-spacing: .14em; }
.language-switch { display: flex; gap: 2px; border: 1px solid #273043; border-radius: 20px; padding: 3px; }
.language-switch button { border: 0; background: transparent; color: #96a4bd; border-radius: 16px; min-width: 40px; min-height: 32px; padding: 4px 10px; font-size: 11px; font-weight: 600; }
.language-switch button[aria-pressed="true"] { background: #253149; color: #fff; }
.card {
  position: relative;
  overflow: hidden;
  border: 1px solid #29364c;
  border-radius: 30px;
  padding: 38px 30px 28px;
  background: linear-gradient(155deg, #152138e0, #0e1524f2 48%, #101623f5);
  box-shadow: 0 24px 80px #0004;
}
.app-mark { width: 104px; height: 104px; margin: 0 auto 27px; border-radius: 26px; position: relative; }
.app-mark::before { content: ""; position: absolute; inset: -12px; background: #156afb; filter: blur(34px); opacity: .23; }
.app-mark img { position: relative; width: 104px; height: 104px; display: block; border-radius: 26px; box-shadow: 0 0 0 1px #85beff35, 0 10px 25px #0004; }
.eyebrow { margin: 0 0 16px; text-align: center; font-size: 9px; font-weight: 650; letter-spacing: .14em; color: #92a7c7; line-height: 1.6; }
h1 { margin: 0; text-align: center; font-size: clamp(38px, 10.4vw, 55px); font-weight: 650; line-height: 1.07; letter-spacing: -.055em; }
h1 span { display: block; }
.accent { color: #7cdaed; }
.intro { max-width: 300px; margin: 19px auto 29px; text-align: center; color: #aebbd0; font-size: 14px; line-height: 1.65; text-wrap: balance; }
.download-actions { text-align: center; }
.play-button {
  display: flex; justify-content: center; align-items: center; gap: 12px;
  min-height: 58px; padding: 16px 12px; border-radius: 16px;
  text-decoration: none; background: #96e4f1; color: #102032; font-size: 16px; font-weight: 700;
  box-shadow: 0 4px 24px #46a9cc13;
}
.play-button:hover { background: #b1eff8; }
.play-button svg { flex: 0 0 auto; }
.copy-button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #b7c6dc; font-size: 12px; min-height: 44px; margin: 6px 0 0; padding: 9px 0; }
.copy-button:hover { color: #fff; }
.copy-status { margin: 0; color: #96e4f1; font-size: 12px; }
.copy-status:empty { display: none; }
.manual-copy { margin-top: 8px; text-align: left; }
.manual-copy label { color: #aebbd0; font-size: 12px; }
.manual-copy input { display: block; width: 100%; margin-top: 7px; background: #0a101c; border: 1px solid #344157; color: #dbe8f6; border-radius: 8px; padding: 11px; font-size: 12px; }
.help { display: flex; gap: 12px; padding-top: 22px; margin-top: 16px; border-top: 1px solid #ffffff13; }
.help-mark { flex: 0 0 25px; margin-top: 0; font-size: 21px; color: #7992b0; }
.help h2 { margin: 0 0 7px; color: #d6dfed; font-size: 12px; font-weight: 600; line-height: 1.5; }
.help p { margin: 0; color: #99a8be; font-size: 12px; line-height: 1.7; text-wrap: pretty; }
footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 23px 5px 0; color: #7f8da6; font-size: 11px; }
footer nav { display: flex; align-items: center; gap: 12px; }
footer a { text-decoration: none; padding: 8px 0; }
footer a:hover { color: #dce9fb; text-decoration: underline; }
.footer-dot { color: #47546c; }
:focus-visible { outline: 3px solid #c8f4fc; outline-offset: 4px; }
@media (min-width: 600px) {
  .page { padding-top: 54px; }
  .card { padding: 42px 40px 31px; }
}
@media (max-width: 359px) {
  .page { padding: 18px 14px; }
  .card { padding: 29px 20px 24px; border-radius: 24px; }
  .app-mark { margin-bottom: 23px; }
  .eyebrow { font-size: 8px; }
}

</style>

  <script>
    (() => {
      const storeUrl = 'https://play.google.com/store/apps/details?id=com.neo4dwall.app';
      const copy = {
        en: {
          eyebrow: 'MADE FOR YOUR ANDROID SCREEN',
          headlineTop: 'Your screen.', headlineBottom: 'In motion.',
          intro: 'Make your Android screen your own.',
          open: 'Open in Google Play', copy: 'Copy Google Play link',
          helpTitle: 'Link not opening?',
          helpText: 'Open this page in your browser, or search Google Play for “Neo 4D Wall”.',
          privacy: 'Privacy', support: 'Support', copied: 'Link copied.',
          manualCopy: 'Select and copy this link:',
          title: 'Neo 4D Wall · Your screen. In motion.',
          information: 'Information', language: 'Language',
          description: 'Find Neo 4D Wall on Google Play and make your Android screen your own.'
        },
        tr: {
          eyebrow: 'ANDROID EKRANINIZ İÇİN',
          headlineTop: 'Ekranınıza', headlineBottom: 'hareket katın.',
          intro: 'Android ekranınızı tarzınıza göre kişiselleştirin.',
          open: 'Google Play’de aç', copy: 'Google Play bağlantısını kopyala',
          helpTitle: 'Bağlantı açılmıyor mu?',
          helpText: 'Bu sayfayı tarayıcınızda açın veya Google Play’de “Neo 4D Wall”ı arayın.',
          privacy: 'Gizlilik', support: 'Destek', copied: 'Bağlantı kopyalandı.',
          manualCopy: 'Bu bağlantıyı seçip kopyalayın:',
          title: 'Neo 4D Wall · Ekranınıza hareket katın.',
          information: 'Bilgi', language: 'Dil',
          description: 'Neo 4D Wall’ı Google Play’de bulun ve Android ekranınızı tarzınıza göre kişiselleştirin.'
        }
      };
      let language = navigator.language.toLowerCase().startsWith('tr') ? 'tr' : 'en';
      const languageSwitch = document.querySelector('.language-switch');
      const copyButton = document.getElementById('copy-link');
      const status = document.getElementById('copy-status');
      function setLanguage(next) {
        language = next;
        document.documentElement.lang = next;
        document.title = copy[next].title;
        document.querySelector('meta[name="description"]').content = copy[next].description;
        document.querySelectorAll('[data-copy]').forEach(element => {
          element.textContent = copy[next][element.dataset.copy];
        });
        document.querySelectorAll('[data-language]').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.language === next));
        });
        languageSwitch.setAttribute('aria-label', copy[next].language);
        document.querySelector('footer nav').setAttribute('aria-label', copy[next].information);
        status.textContent = '';
      }
      languageSwitch.addEventListener('click', event => {
        const button = event.target.closest('[data-language]');
        if (button) setLanguage(button.dataset.language);
      });
      copyButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(storeUrl);
          status.textContent = copy[language].copied;
          document.getElementById('manual-copy').hidden = true;
        } catch {
          document.getElementById('manual-copy').hidden = false;
          const input = document.getElementById('store-link');
          input.focus();
          input.select();
        }
      });
      setLanguage(language);
      languageSwitch.hidden = false;
      copyButton.hidden = false;
    })();
  </script>
